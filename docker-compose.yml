# Local dev only. After `docker compose up -d`, from backend/:
#   cp .env.example .env  (set DATABASE_URL + REDIS_URL — see .env.example)
#   bun run db:setup:local
services:
  postgres:
    image: postgres:17
    container_name: quickprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickprint
      POSTGRES_USER: quickprint
      POSTGRES_PASSWORD: quickprint_dev
    ports:
      - "5432:5432"
    volumes:
      - quickprint-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quickprint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quickprint-redis-data:/data

volumes:
  quickprint-postgres-data:
  quickprint-redis-data: